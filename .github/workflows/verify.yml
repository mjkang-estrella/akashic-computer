name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    # Playwright 1.58 cannot install browsers on Ubuntu 26.04, which ubuntu-latest now selects.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_CONVEX_URL: https://artful-nightingale-491.convex.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix local-computer
      - run: npm run typecheck --prefix local-computer
      - run: npm run build --prefix local-computer
      - run: npm test --prefix local-computer
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
